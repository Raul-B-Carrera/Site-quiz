<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
        rel="stylesheet">

    <title>Verificação</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/inicio.css">
</head>

<body>

    <head>
        <h1 class="titulo">Ficha de Cadastro</h1>
    </head>

    <Section class="caixaUpdate">
        <header class="titulo">
            <h2>
                Já é cadastrado?
            </h2>
        </header>

        <div class="corpo">
            <div>
                <p>Digite seu nome para atualizar sua parte favorita</p>
                <label for="">Nome</label>
                <input class="nome" type="text" placeholder="Digite seu nome">
            </div>

            <div class="part_jojo">
                <label for="">Parte favorita de jojo</label>
                <select name="part_jojo" id="">
                    <option value="parte 1">Parte 1</option>
                    <option value="parte 2">Parte 2</option>
                    <option value="parte 3">Parte 3</option>
                    <option value="parte 4">Parte 4</option>
                    <option value="parte 5">Parte 5</option>
                    <option value="parte 6">Parte 6</option>
                    <option value="parte 7">Parte 7</option>
                    <option value="parte 8">Parte 8</option>
                </select>
            </div>

            <button class="confirmar">
                CONFIRMAR
            </button>
        </div>
    </Section>
    <button class="button_cadastro">
        NÃO
    </button>

    <script src="./js/inicio.js"></script>
</body>

</html>
