<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

    <title>Cadastro</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/cadastro.css">
</head>

<body>

    <aside>
        <img src="./img/jojo_symbol.png" alt="Imagem de Jojo" class="img_cadastro">
        <img src="./img/killerQueen.png" alt="Killer Queen" class="killer_queen">
    </aside>

    <head>
        <h1 class="titulo">Ficha de Cadastro</h1>
    </head>

    <Section>
        <form action="">
            <div>
                <label for="">Nome</label>
                <input name="nome" type="text" placeholder="Digite seu nome">
            </div>
            <div>
                <label for="">Email</label>
                <input type="text" name="email" id="" placeholder="Digite seu email">
            </div>
            <div>
                <label for="">Idade</label>
                <input type="number" name="idade" id="" placeholder="Digite sua idade">
            </div>
            <div>
                <label for="">Parte favorita de jojo</label>
                <select name="part_jojo" id="">
                    <option value="parte 1">Parte 1</option>
                    <option value="parte 2">Parte 2</option>
                    <option value="parte 3">Parte 3</option>
                    <option value="parte 4">Parte 4</option>
                    <option value="parte 5">Parte 5</option>
                    <option value="parte 6">Parte 6</option>
                    <option value="parte 7">Parte 7</option>
                    <option value="parte 8">Parte 8</option>
                </select>
            </div>
            <div class="div_sexo">
                <label for="" class="sexo"> <span>Masculino</span> <input name="sexo" value="Masculino"
                        type="radio"></label>
                <label for="" class="sexo"> <span>Feminino</span> <input name="sexo" value="Feminino"
                        type="radio"></label>
                <label for="" class="sexo"> <span>Outros</span> <input name="sexo" value="Outros" type="radio"></label>
            </div>
            </div>
            <div class="div_button">
                <button class="button_cadastro">
                    Confirmar
                </button>
            </div>
        </form>
    </Section>

    <script src="./js/cadastro.js"></script>
</body>

</html>
